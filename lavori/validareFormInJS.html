<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Validazione form</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
    }

    form {
      max-width: 400px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #007acc;
      outline: none;
    }

    input[type="button"] {
      margin-top: 20px;
      background-color: #007acc;
      color: #ffffff;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    input[type="button"]:hover {
      background-color: #005fa3;
    }
  </style>

  <script>
    function valida() {
      const nome = document.invio.nome.value;
      const telefono = document.invio.telefono.value;
      const email = document.invio.email.value;
      const password = document.invio.password.value;
      const conferma = document.invio.conferma.value;

      const espressioneEmail = /^([a-zA-Z0-9_.-])+@(([a-zA-Z0-9-]{2,})+.)+([a-zA-Z0-9]{2,})+$/;
      const caratteriSpeciali = /[@#?$-_]/;

      if (!nome) {
        alert("Devi inserire un nome");
        document.invio.nome.focus();
        return false;
      }

      if (!telefono || isNaN(telefono)) {
        alert("Devi inserire il telefono, attenzione deve essere numerico!");
        document.invio.telefono.value = "";
        document.invio.telefono.focus();
        return false;
      }

      if (!email || !espressioneEmail.test(email)) {
        alert("Devi inserire un indirizzo mail corretto");
        document.invio.email.focus();
        return false;
      }

      if (!password || password.length < 6) {
        alert("Scegli una password, minimo 6 caratteri");
        document.invio.password.focus();
        return false;
      }

      if (!caratteriSpeciali.test(password)) {
        alert("La password deve contenere almeno un carattere speciale (@ # ? $ - _)");
        document.invio.password.focus();
        return false;
      }

      if (!conferma) {
        alert("Devi confermare la password");
        document.invio.conferma.focus();
        return false;
      }

      if (password !== conferma) {
        alert("La conferma password non corrisponde");
        document.invio.conferma.value = "";
        document.invio.conferma.focus();
        return false;
      }

      document.invio.submit();
    }
  </script>
</head>

<body>

<form method="post" action="#" name="invio">
  <label for="nome">Nome</label>
  <input type="text" name="nome">

  <label for="telefono">Telefono</label>
  <input type="text" name="telefono">

  <label for="email">Email:</label>
  <input type="text" name="email">

  <label for="password">Password</label>
  <input type="password" name="password">

  <label for="conferma">Conferma password</label>
  <input type="password" name="conferma">

  <br>
  <input type="button" value="Invia" onClick="valida()">
</form>

</body>
</html>
