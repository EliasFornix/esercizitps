<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrafica 1.0</title>
</head>
<body>
<h2>Inserisci i tuoi dati</h2>

<input id="nome" placeholder="Nome"><br>
<input id="cognome" placeholder="Cognome"><br>
<input id="indirizzo" placeholder="Indirizzo"><br>
<input id="citta" placeholder="Città"><br>
<input id="cap" placeholder="CAP"><br>
<input id="data-nascita" type="date"><br><br>

<button onclick="generaScheda()">Genera Scheda</button>

<h3>Risultato:</h3>
<p id="nome-stampa"></p>
<p id="cognome-stampa"></p>
<p id="indirizzo-stampa"></p>
<p id="citta-stampa"></p>
<p id="cap-stampa"></p>
<p id="data-stampa"></p>

<script>
var campoNome = document.getElementById('nome');
var campoCognome = document.getElementById('cognome');
var campoIndirizzo = document.getElementById('indirizzo');
var campoCitta = document.getElementById('citta');
var campoCap = document.getElementById('cap');
var campoData = document.getElementById('data-nascita');

var stampaNome = document.getElementById('nome-stampa');
var stampaCognome = document.getElementById('cognome-stampa');
var stampaIndirizzo = document.getElementById('indirizzo-stampa');
var stampaCitta = document.getElementById('citta-stampa');
var stampaCap = document.getElementById('cap-stampa');
var stampaData = document.getElementById('data-stampa');

var generazioni = [
    { nome: "Greatest Generation", inizio: 1901, fine: 1927 },
    { nome: "Generazione Silenziosa", inizio: 1928, fine: 1945 },
    { nome: "Baby Boomers", inizio: 1946, fine: 1964 },
    { nome: "Generazione X", inizio: 1965, fine: 1980 },
    { nome: "Millennials", inizio: 1981, fine: 1996 },
    { nome: "Generazione Z", inizio: 1997, fine: 2012 },
    { nome: "Generazione Alpha", inizio: 2013, fine: 2025 }
];

function generaScheda() {
    var nome = campoNome.value;
    var cognome = campoCognome.value;
    var indirizzo = campoIndirizzo.value;
    var citta = campoCitta.value;
    var cap = campoCap.value;
    var data = campoData.value;

    var annoNascita = parseInt(data.substring(0, 4));
    var generazione = "Generazione sconosciuta";

    for (var i = 0; i < generazioni.length; i++) {
        if (annoNascita >= generazioni[i].inizio && annoNascita <= generazioni[i].fine) {
            generazione = generazioni[i].nome;
        }
    }

    stampaNome.textContent = "Nome: " + nome;
    stampaCognome.textContent = "Cognome: " + cognome;
    stampaIndirizzo.textContent = "Indirizzo: " + indirizzo;
    stampaCitta.textContent = "Città: " + citta;
    stampaCap.textContent = "CAP: " + cap;
    stampaData.textContent = "Data di nascita: " + data + " (" + generazione + ")";
}
</script>
</body>
</html>
