<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Numeri casuali</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f4f4f4;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 80%;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
    .highlight {
      background-color: #c6ffb3;
    }
  </style>
</head>
<body>

  <h2>Numeri casuali da -100 a 100</h2>
  <div id="output"></div>

  <script>
    var numeri = [];
    var somma = 0;
    var max = -100;
    var min = 100;
    var maggiori50 = [];

    // genera 100 numeri casuali tra -100 e 100
    for (var i = 0; i < 100; i++) {
      var n = Math.floor(Math.random() * 201) - 100; // da -100 a 100
      numeri[i] = n;
      somma = somma + n;

      if (n > max) max = n;
      if (n < min) min = n;
      if (n > 50) maggiori50.push(n);
    }

    var media = somma / numeri.length;

    // crea tabella HTML
    var testo = "<table>";
    testo += "<tr><th>Indice</th><th>Valore</th></tr>";

    for (var i = 0; i < numeri.length; i++) {
      if (numeri[i] > 50)
        testo += "<tr class='highlight'><td>" + i + "</td><td>" + numeri[i] + "</td></tr>";
      else
        testo += "<tr><td>" + i + "</td><td>" + numeri[i] + "</td></tr>";
    }

    testo += "</table>";

    testo += "<p><b>Media:</b> " + media.toFixed(2) + "</p>";
    testo += "<p><b>Massimo:</b> " + max + "</p>";
    testo += "<p><b>Minimo:</b> " + min + "</p>";
    testo += "<p><b>Numeri maggiori di 50:</b> " + maggiori50.length + "</p>";

    document.getElementById("output").innerHTML = testo;
  </script>

</body>
</html>
