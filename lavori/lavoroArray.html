<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Numeri</title>
<style>
  table, th, td {
    border: 1px solid black;
    border-collapse: collapse;
    padding: 5px;
    text-align: center;
  }
</style>
</head>
<body>
<h2>Array Numeri Casuali</h2>
<button onclick="generaArray()">Genera Numeri</button>
<h3>Array Completo:</h3>
<div id="griglia-array"></div>
<h3>Statistiche:</h3>
<p id="media"></p>
<p id="massimo"></p>
<p id="minimo"></p>
<h3>Numeri > 50:</h3>
<div id="griglia-maggiori"></div>

<script>
var arrayNumeri = [];

function generaArray() {
    arrayNumeri = [];
    for (var i = 0; i < 100; i++) {
        var numero = Math.floor(Math.random() * 201) - 100;
        arrayNumeri.push(numero);
    }

    var somma = 0;
    var max = arrayNumeri[0];
    var min = arrayNumeri[0];
    var maggiori50 = [];

    for (var j = 0; j < arrayNumeri.length; j++) {
        somma = somma + arrayNumeri[j];
        if (arrayNumeri[j] > max) {
            max = arrayNumeri[j];
        }
        if (arrayNumeri[j] < min) {
            min = arrayNumeri[j];
        }
        if (arrayNumeri[j] > 50) {
            maggiori50.push(arrayNumeri[j]);
        }
    }

    var media = somma / arrayNumeri.length;

    document.getElementById("media").textContent = "Media: " + media.toFixed(2);
    document.getElementById("massimo").textContent = "Massimo: " + max;
    document.getElementById("minimo").textContent = "Minimo: " + min;

    var griglia = "<table><tr>";
    for (var k = 0; k < arrayNumeri.length; k++) {
        griglia += "<td>" + arrayNumeri[k] + "</td>";
        if ((k + 1) % 10 == 0) {
            griglia += "</tr><tr>";
        }
    }
    griglia += "</tr></table>";
    document.getElementById("griglia-array").innerHTML = griglia;

    var grigliaMaggiori = "<table><tr>";
    for (var m = 0; m < maggiori50.length; m++) {
        grigliaMaggiori += "<td>" + maggiori50[m] + "</td>";
        if ((m + 1) % 10 == 0) {
            grigliaMaggiori += "</tr><tr>";
        }
    }
    grigliaMaggiori += "</tr></table>";
    document.getElementById("griglia-maggiori").innerHTML = grigliaMaggiori;
}
</script>
</body>
</html>
