<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrafica Studente</title>
</head>
<body>
<h2>Inserisci i tuoi dati</h2>

<input id="nome" placeholder="Nome"><br>
<input id="cognome" placeholder="Cognome"><br>
<input id="data-nascita" type="date"><br>
<input id="indirizzo" placeholder="Indirizzo"><br>
<input id="citta" placeholder="Città"><br>
<input id="cap" placeholder="CAP"><br>
<input id="provincia" placeholder="Provincia"><br><br>

<label><input type="radio" name="genere" value="Maschio"> Maschio</label>
<label><input type="radio" name="genere" value="Femmina"> Femmina</label><br><br>

<label><input type="checkbox" name="mezzo" value="Auto"> Auto</label>
<label><input type="checkbox" name="mezzo" value="Bici"> Bici</label>
<label><input type="checkbox" name="mezzo" value="Moto"> Moto</label><br><br>

<select id="materia">
  <option value="Matematica">Matematica</option>
  <option value="Storia">Storia</option>
  <option value="Informatica">Informatica</option>
</select><br><br>

<button onclick="generaScheda()">Genera Scheda</button>

<h3>Risultato:</h3>
<p id="nome-stampa"></p>
<p id="cognome-stampa"></p>
<p id="indirizzo-stampa"></p>
<p id="citta-stampa"></p>
<p id="cap-stampa"></p>
<p id="data-stampa"></p>
<p id="genere-stampa"></p>
<p id="provincia-stampa"></p>
<p id="mezzi-stampa"></p>
<p id="materia-stampa"></p>

<script>
var campoNome = document.getElementById('nome');
var campoCognome = document.getElementById('cognome');
var campoData = document.getElementById('data-nascita');
var campoIndirizzo = document.getElementById('indirizzo');
var campoCitta = document.getElementById('citta');
var campoCap = document.getElementById('cap');
var campoProvincia = document.getElementById('provincia');
var campoGenere = document.getElementsByName('genere');
var campoMezzi = document.getElementsByName('mezzo');
var campoMateria = document.getElementById('materia');

var stampaNome = document.getElementById('nome-stampa');
var stampaCognome = document.getElementById('cognome-stampa');
var stampaIndirizzo = document.getElementById('indirizzo-stampa');
var stampaCitta = document.getElementById('citta-stampa');
var stampaCap = document.getElementById('cap-stampa');
var stampaData = document.getElementById('data-stampa');
var stampaGenere = document.getElementById('genere-stampa');
var stampaProvincia = document.getElementById('provincia-stampa');
var stampaMezzi = document.getElementById('mezzi-stampa');
var stampaMateria = document.getElementById('materia-stampa');

var fasceGenerazione = [
    { nome: "Greatest Generation", inizio: 1901, fine: 1927 },
    { nome: "Generazione Silenziosa", inizio: 1928, fine: 1945 },
    { nome: "Baby Boomers", inizio: 1946, fine: 1964 },
    { nome: "Generazione X", inizio: 1965, fine: 1980 },
    { nome: "Millennials", inizio: 1981, fine: 1996 },
    { nome: "Generazione Z", inizio: 1997, fine: 2012 },
    { nome: "Generazione Alpha", inizio: 2013, fine: 2025 }
];

function generaScheda() {
    var nome = campoNome.value;
    var cognome = campoCognome.value;
    var data = campoData.value;
    var indirizzo = campoIndirizzo.value;
    var citta = campoCitta.value;
    var cap = campoCap.value;
    var provincia = campoProvincia.value;

    var annoNascita = parseInt(data.substring(0, 4));

    var generazione = "Generazione sconosciuta";
    for (var i = 0; i < fasceGenerazione.length; i++) {
        if (annoNascita >= fasceGenerazione[i].inizio && annoNascita <= fasceGenerazione[i].fine) {
            generazione = fasceGenerazione[i].nome;
        }
    }

    var genere = "Non specificato";
    for (var j = 0; j < campoGenere.length; j++) {
        if (campoGenere[j].checked) {
            genere = campoGenere[j].value;
        }
    }

    var mezzi = [];
    for (var k = 0; k < campoMezzi.length; k++) {
        if (campoMezzi[k].checked) {
            mezzi.push(campoMezzi[k].value);
        }
    }

    var listaMezzi = "";
    if (mezzi.length == 0) {
        listaMezzi = "Nessuno";
    } else {
        for (var n = 0; n < mezzi.length; n++) {
            if (n == 0) {
                listaMezzi = mezzi[n];
            } else {
                listaMezzi = listaMezzi + ", " + mezzi[n];
            }
        }
    }

    stampaNome.textContent = "Nome: " + nome;
    stampaCognome.textContent = "Cognome: " + cognome;
    stampaIndirizzo.textContent = "Indirizzo: " + indirizzo;
    stampaCitta.textContent = "Città: " + citta;
    stampaCap.textContent = "CAP: " + cap;
    stampaData.textContent = "Data di nascita: " + data + " (" + generazione + ")";
    stampaGenere.textContent = "Genere: " + genere;
    stampaProvincia.textContent = "Provincia: " + provincia;
    stampaMezzi.textContent = "Mezzi di locomozione: " + listaMezzi;
    stampaMateria.textContent = "Materia preferita: " + campoMateria.value;
}
</script>
</body>
</html>
