<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrafica Studente</title>
</head>
<body>
<h2>Inserisci i tuoi dati</h2>

<input id="name" placeholder="Nome"><br>
<input id="surname" placeholder="Cognome"><br>
<input id="DOB" type="date"><br>
<input id="address" placeholder="Indirizzo"><br>
<input id="city" placeholder="Città"><br>
<input id="postal-code" placeholder="CAP"><br>
<input id="prov" placeholder="Provincia"><br><br>

<label><input type="radio" name="sesso" value="Maschio"> Maschio</label>
<label><input type="radio" name="sesso" value="Femmina"> Femmina</label><br><br>

<label><input type="checkbox" name="locomozione" value="Auto"> Auto</label>
<label><input type="checkbox" name="locomozione" value="Bici"> Bici</label>
<label><input type="checkbox" name="locomozione" value="Moto"> Moto</label><br><br>

<select id="materie">
  <option value="Matematica">Matematica</option>
  <option value="Storia">Storia</option>
  <option value="Informatica">Informatica</option>
</select><br><br>

<button onclick="generaScheda()">Genera Scheda</button>

<h3>Risultato:</h3>
<p id="nameO"></p>
<p id="surnameO"></p>
<p id="addressO"></p>
<p id="cityO"></p>
<p id="postal-codeO"></p>
<p id="DOBO"></p>
<p id="sessoO"></p>
<p id="provO"></p>
<p id="locomozioneO"></p>
<p id="materieO"></p>

<script>
const nomeField = document.getElementById('name');
const cognomeField = document.getElementById('surname');
const nascitaField = document.getElementById('DOB');
const indirizzoField = document.getElementById('address');
const cittaField = document.getElementById('city');
const capField = document.getElementById('postal-code');
const provinciaField = document.getElementById('prov');
const sessoRadio = document.getElementsByName('sesso');
const trasportoCheck = document.getElementsByName('locomozione');
const materiaSelect = document.getElementById('materie');

const nomeOut = document.getElementById('nameO');
const cognomeOut = document.getElementById('surnameO');
const indirizzoOut = document.getElementById('addressO');
const cittaOut = document.getElementById('cityO');
const capOut = document.getElementById('postal-codeO');
const nascitaOut = document.getElementById('DOBO');
const sessoOut = document.getElementById('sessoO');
const provinciaOut = document.getElementById('provO');
const trasportoOut = document.getElementById('locomozioneO');
const materiaOut = document.getElementById('materieO');

const generazioniSociali = {
    "Greatest Generation": { start: 1901, end: 1927 },
    "Silent Generation": { start: 1928, end: 1945 },
    "Baby Boomers": { start: 1946, end: 1964 },
    "Generation X": { start: 1965, end: 1980 },
    "Millennials": { start: 1981, end: 1996 },
    "Generation Z": { start: 1997, end: 2012 },
    "Generation Alpha": { start: 2013, end: 2025 }
};

function generaScheda() {
    const nome = nomeField.value;
    const cognome = cognomeField.value;
    const dataNascita = nascitaField.value;
    const indirizzo = indirizzoField.value;
    const citta = cittaField.value;
    const cap = capField.value;
    const provincia = provinciaField.value;
    const dataObj = new Date(dataNascita);
    let generazione = "Generazione sconosciuta";
    for (const gen in generazioniSociali) {
        const { start, end } = generazioniSociali[gen];
        if (dataObj.getFullYear() >= start && dataObj.getFullYear() <= end) {
            generazione = gen;
            break;
        }
    }
    let sesso = "Non specificato";
    for (const s of sessoRadio) {
        if (s.checked) {
            sesso = s.value;
            break;
        }
    }
    let mezzi = [];
    for (const mezzo of trasportoCheck) {
        if (mezzo.checked) {
            mezzi.push(mezzo.value);
        }
    }
    nomeOut.textContent = `Nome: ${nome}`;
    cognomeOut.textContent = `Cognome: ${cognome}`;
    indirizzoOut.textContent = `Indirizzo: ${indirizzo}`;
    cittaOut.textContent = `Città: ${citta}`;
    capOut.textContent = `CAP: ${cap}`;
    nascitaOut.textContent = `Data di nascita: ${dataObj.toLocaleDateString()} (${generazione})`;
    sessoOut.textContent = `Sesso: ${sesso}`;
    provinciaOut.textContent = `Provincia: ${provincia}`;
    trasportoOut.textContent = `Mezzi di locomozione: ${mezzi.join(', ') || 'Nessuno'}`;
    materiaOut.textContent = `Materia preferita: ${materiaSelect.value}`;
}
</script>
</body>
</html>
