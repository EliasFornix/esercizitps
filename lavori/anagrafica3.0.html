<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagrafica Studente 2.0</title>
</head>
<body>
<h2>Inserisci i tuoi dati</h2>

<input id="name" placeholder="Nome"><br>
<input id="surname" placeholder="Cognome"><br>
<input id="DOB" type="date"><br>
<input id="address" placeholder="Indirizzo"><br>
<input id="city" placeholder="Città"><br>
<input id="postal-code" placeholder="CAP"><br>
<input id="prov" placeholder="Provincia"><br><br>

<label><input type="radio" name="sesso" value="Maschio"> Maschio</label>
<label><input type="radio" name="sesso" value="Femmina"> Femmina</label><br><br>

<label><input type="checkbox" name="locomozione" value="Auto"> Auto</label>
<label><input type="checkbox" name="locomozione" value="Bici"> Bici</label>
<label><input type="checkbox" name="locomozione" value="Moto"> Moto</label><br><br>

<select id="materie">
  <option value="Matematica">Matematica</option>
  <option value="Storia">Storia</option>
  <option value="Informatica">Informatica</option>
</select><br><br>

<button onclick="generaScheda()">Genera Scheda</button>

<h3>Risultato:</h3>
<p id="nameO"></p>
<p id="surnameO"></p>
<p id="addressO"></p>
<p id="cityO"></p>
<p id="postal-codeO"></p>
<p id="DOBO"></p>
<p id="sessoO"></p>
<p id="provO"></p>
<p id="locomozioneO"></p>
<p id="materieO"></p>

<script>
const generazioniSociali = {
    "Greatest Generation": { start: 1901, end: 1927 },
    "Silent Generation": { start: 1928, end: 1945 },
    "Baby Boomers": { start: 1946, end: 1964 },
    "Generation X": { start: 1965, end: 1980 },
    "Millennials": { start: 1981, end: 1996 },
    "Generation Z": { start: 1997, end: 2012 },
    "Generation Alpha": { start: 2013, end: 2025 }
};

function generaScheda() {
    const persona = {
        nome: document.getElementById('name').value,
        cognome: document.getElementById('surname').value,
        dataNascita: document.getElementById('DOB').value,
        indirizzo: document.getElementById('address').value,
        citta: document.getElementById('city').value,
        cap: document.getElementById('postal-code').value,
        provincia: document.getElementById('prov').value,
        sesso: getSesso(),
        mezzi: getMezzi(),
        materia: document.getElementById('materie').value
    };

    const dataObj = new Date(persona.dataNascita);
    let generazione = "Generazione sconosciuta";
    for (const gen in generazioniSociali) {
        const { start, end } = generazioniSociali[gen];
        if (dataObj.getFullYear() >= start && dataObj.getFullYear() <= end) {
            generazione = gen;
            break;
        }
    }

    document.getElementById('nameO').textContent = `Nome: ${persona.nome}`;
    document.getElementById('surnameO').textContent = `Cognome: ${persona.cognome}`;
    document.getElementById('addressO').textContent = `Indirizzo: ${persona.indirizzo}`;
    document.getElementById('cityO').textContent = `Città: ${persona.citta}`;
    document.getElementById('postal-codeO').textContent = `CAP: ${persona.cap}`;
    document.getElementById('DOBO').textContent = `Data di nascita: ${dataObj.toLocaleDateString()} (${generazione})`;
    document.getElementById('sessoO').textContent = `Sesso: ${persona.sesso}`;
    document.getElementById('provO').textContent = `Provincia: ${persona.provincia}`;
    document.getElementById('locomozioneO').textContent = `Mezzi di locomozione: ${persona.mezzi.join(', ') || 'Nessuno'}`;
    document.getElementById('materieO').textContent = `Materia preferita: ${persona.materia}`;
}

function getSesso() {
    const sessoRadio = document.getElementsByName('sesso');
    for (const s of sessoRadio) {
        if (s.checked) {
            return s.value;
        }
    }
    return "Non specificato";
}

function getMezzi() {
    const trasportoCheck = document.getElementsByName('locomozione');
    let mezzi = [];
    for (const mezzo of trasportoCheck) {
        if (mezzo.checked) {
            mezzi.push(mezzo.value);
        }
    }
    return mezzi;
}
</script>
</body>
</html>
